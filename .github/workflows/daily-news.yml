# Daily Kannur News Update — DISABLED while AdSense review is pending.
# News.html aggregated headlines from Google News RSS, which AdSense
# treats as scraped/third-party content. The page is currently hidden
# (noindex + no nav link). Re-enable later by uncommenting the cron
# below and re-adding the page to the sitemap.

name: Daily Kannur News Update (disabled)

on:
  # schedule:
  #   - cron: '30 2 * * *'   # 8:00 AM IST
  workflow_dispatch:           # manual-run only while disabled

jobs:
  update-news:
    runs-on: ubuntu-latest
    if: ${{ false }}           # hard block accidental manual runs too

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Generate news page
        run: python generate_news.py

      - name: Commit and push updated news
        run: |
          git config --global user.name "TravelKannur Bot"
          git config --global user.email "info@travelkannur.in"
          git add news.html sitemap.xml
          git diff --staged --quiet || git commit -m "Auto news update - $(date +'%d %b %Y %H:%M IST')"
          git push
