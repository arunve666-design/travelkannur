name: Daily Events Update

on:
  schedule:
    # 6:00 AM IST = 12:30 AM UTC
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Generate today's events page
        run: python generate_events.py

      - name: Commit and push updated events
        run: |
          git config --global user.name "TravelKannur Bot"
          git config --global user.email "info@travelkannur.in"
          git add events.html
          git diff --staged --quiet || git commit -m "Daily events update - $(date +'%d %b %Y')"
          git push
